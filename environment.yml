# Conda environment for the scattered-light glitch characterisation study.
#
#   conda env create -f environment.yml
#   conda activate gwglitch
#
# Notes
# -----
# * `gwdetchar` is deliberately absent.  Its dependency chain (lalsuite,
#   dqsegdb2, gwdatafind) has no win-64 build on conda-forge, so it cannot be
#   installed on native Windows.  Everything this project needs from it -- the
#   Q-transform and the omega-scan rendering -- is reimplemented on top of
#   `gwpy.timeseries.TimeSeries.q_transform`, which is pure Python/SciPy and
#   fully portable.  See docs/DECISIONS.md (D-04).
# * `python-nds2-client` DOES have a win-64 build and is what gives us
#   `TimeSeries.fetch(..., host='nds.gwosc.org')` for auxiliary channels.
name: gwglitch
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.11
  - matplotlib>=3.8
  - pandas>=2.0
  - astropy>=5.3
  - h5py>=3.9
  - requests>=2.31
  - tqdm>=4.66
  - scikit-learn>=1.3
  - seaborn>=0.13
  - pyyaml>=6.0
  - jupyterlab
  - ipykernel
  - pytest>=7.4
  - gwpy>=3.0
  - gwosc>=0.7
  - python-nds2-client
  - dill
